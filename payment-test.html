<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار دفع رؤيا</title><link rel="stylesheet" href="https://cdn.moyasar.com/mpf/1.15.0/moyasar.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.moyasar.com/mpf/1.15.0/moyasar.js"></script><style>body{font-family:system-ui;background:#090d25;color:#fff;margin:0;padding:20px}.box{max-width:560px;margin:auto;background:#101632;border:1px solid #31385f;border-radius:24px;padding:22px}button,input{font:inherit}.btn{border:0;border-radius:14px;padding:13px 18px;background:#e5c574;color:#191326;font-weight:800;margin:6px;cursor:pointer}.muted{color:#a9aec8;line-height:1.8}.plans{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.status{padding:12px;border-radius:14px;background:#0b112d;border:1px solid #293257;margin:12px 0}.login input{width:100%;box-sizing:border-box;margin:6px 0;padding:12px;border-radius:12px;border:1px solid #30385f;background:#0a1028;color:#fff}.mysr-form{margin-top:18px}</style></head><body><div class="box"><h1>اختبار دفع رؤيا</h1><p class="muted">هذه صفحة اختبار ميسر فقط. لا يتم تفعيل Premium إلا بعد تحقق الخادم من العملية.</p><div id="status" class="status">جارٍ التحقق من الجلسة…</div><div id="login" class="login" style="display:none"><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button class="btn" onclick="signIn()">تسجيل الدخول</button></div><div id="plans" class="plans" style="display:none"><button class="btn" onclick="pay('monthly')">شهري 5 ر.س</button><button class="btn" onclick="pay('annual')">سنوي 30 ر.س</button><button class="btn" onclick="pay('lifetime')">مدى الحياة 70 ر.س</button></div><div class="mysr-form"></div><p><a href="./" style="color:#e5c574">العودة إلى رؤيا</a></p></div><script>const SUPABASE_URL='https://oajqczrxzurwvxjkbseq.supabase.co';const SUPABASE_KEY='sb_publishable_9LTupYVJR3kKTL4xqj3pdw_vA67W-o4';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let user=null;const st=document.getElementById('status');async function boot(){const {data}=await sb.auth.getUser();user=data?.user||null;if(user){st.textContent='مسجل الدخول: '+(user.email||user.id);document.getElementById('plans').style.display='flex';document.getElementById('login').style.display='none'}else{st.textContent='سجل الدخول أولًا لاختبار الدفع.';document.getElementById('login').style.display='block'}await handleReturn()}async function signIn(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;st.textContent='جارٍ تسجيل الدخول…';const {error}=await sb.auth.signInWithPassword({email,password});if(error){st.textContent='تعذر تسجيل الدخول: '+error.message;return}await boot()}async function pay(planId){if(!user){st.textContent='يجب تسجيل الدخول أولًا.';return}st.textContent='جارٍ تجهيز الباقة…';const {data:plan,error:pe}=await sb.from('subscription_plans').select('id,name_ar,price_sar').eq('id',planId).eq('is_active',true).single();if(pe||!plan){st.textContent='تعذر تحميل الباقة.';return}const {data:cfg,error:ce}=await sb.functions.invoke('moyasar-public-config',{body:{}});if(ce||!cfg?.publishable_key){st.textContent='تعذر تحميل إعدادات ميسر.';return}localStorage.setItem('roya_pending_plan',planId);document.querySelector('.mysr-form').innerHTML='';const cb=new URL(location.href);cb.search='';cb.searchParams.set('payment_return','1');st.textContent='تم تجهيز نموذج الدفع التجريبي.';try{Moyasar.init({element:'.mysr-form',amount:Math.round(Number(plan.price_sar)*100),currency:'SAR',description:'اشتراك رؤيا - '+plan.name_ar,publishable_api_key:cfg.publishable_key,callback_url:cb.toString(),language:'ar',methods:['creditcard'],supported_networks:['mada','visa','mastercard'],metadata:{user_id:user.id,plan_id:plan.id},on_completed:function(p){if(p?.id)localStorage.setItem('roya_pending_payment',p.id)},on_failure:function(e){console.error(e);st.textContent='فشلت محاولة الدفع قبل الإكمال.'}})}catch(e){console.error(e);st.textContent='تعذر تشغيل نموذج ميسر: '+e.message}}async function handleReturn(){const q=new URLSearchParams(location.search);if(!q.has('payment_return')&&!q.get('id'))return;const paymentId=q.get('id')||localStorage.getItem('roya_pending_payment')||'',planId=localStorage.getItem('roya_pending_plan')||'';history.replaceState({},'',location.pathname);if(!paymentId||!planId){st.textContent='رجعنا من ميسر لكن بيانات التحقق ناقصة.';return}st.textContent='جارٍ التحقق من الدفع مع ميسر…';const {data,error}=await sb.functions.invoke('verify-moyasar-payment',{body:{payment_id:paymentId,plan_id:planId}});if(error||!data?.ok){console.error(error||data);st.textContent='لم يتم تأكيد الدفع، لذلك لم يتم تفعيل Premium.';return}localStorage.removeItem('roya_pending_plan');localStorage.removeItem('roya_pending_payment');st.textContent='تم الدفع والتحقق وتفعيل Premium بنجاح ✓'}boot();</script></body></html>
