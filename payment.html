<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>إتمام الدفع | رؤيا</title>
<link rel="stylesheet" href="https://cdn.moyasar.com/mpf/1.15.0/moyasar.css"><script src="https://cdn.moyasar.com/mpf/1.15.0/moyasar.js"></script>
<style>:root{--gold2:#f2d58a;--muted:#a9aec8}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:#f8f7fb;background:radial-gradient(circle at 80% -10%,#312060 0,transparent 34%),linear-gradient(145deg,#070b24,#11103c)}button,input{font:inherit}.page{width:min(520px,100%);margin:auto;padding:22px 16px 45px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#2a235d,#11183b);border:1px solid #4d467c;display:grid;place-items:center;color:var(--gold2);font-size:21px}.brand b{font-size:20px}.back{border:1px solid #30375e;background:#111632;color:#ddd;border-radius:12px;padding:8px 11px;cursor:pointer}.box{background:linear-gradient(155deg,rgba(20,25,58,.98),rgba(8,12,33,.99));border:1px solid rgba(242,213,138,.2);border-radius:25px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.45)}.head{padding:22px 22px 17px;border-bottom:1px solid rgba(255,255,255,.06)}.eyebrow{color:#d9bc77;font-size:11px;font-weight:800}.head h1{font-size:24px;margin:5px 0}.meta{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.price{font-size:21px;font-weight:900;color:var(--gold2)}.body{padding:18px 22px 23px}.secure{padding:11px 12px;border-radius:14px;background:rgba(214,173,91,.07);border:1px solid rgba(214,173,91,.16);font-size:11px;color:#cfd3e8;line-height:1.65;margin-bottom:14px}.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}.trust div{text-align:center;padding:8px 5px;border-radius:11px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.055);font-size:9px;color:#9ca3c1}.trust b{display:block;color:#e4e6f2;font-size:10px;margin-bottom:2px}.mysr-form{width:100%!important;max-width:none!important}.mysr-form input,.mysr-form select{min-height:45px!important;border-radius:12px!important}.mysr-form button,.mysr-form .mysr-form-button{min-height:46px!important;border-radius:12px!important;background:linear-gradient(135deg,#b98b3d,#f0d083)!important;color:#18111c!important;font-weight:850!important}.foot{text-align:center;color:#747d9f;font-size:9px;line-height:1.6;margin-top:12px}.loading{text-align:center;padding:45px 20px;color:var(--muted)}@media(max-width:600px){.page{padding:13px 10px 30px}.box{border-radius:21px}.head{padding:17px 16px 14px}.head h1{font-size:20px}.body{padding:14px 16px 18px}.trust{gap:5px}.top{margin-bottom:12px}}</style></head>
<body><main class="page"><div class="top"><div class="brand"><div class="mark">◐</div><b>رؤيا</b></div><button class="back" onclick="location.href='./'">العودة</button></div><section class="box" id="checkout"><div class="loading">جارٍ تجهيز صفحة الدفع الآمنة…</div></section></main>
<script>
const plans={monthly:{id:'monthly',name_ar:'شهري',price_sar:5},annual:{id:'annual',name_ar:'سنوي',price_sar:29},lifetime:{id:'lifetime',name_ar:'مدى الحياة',price_sar:49}};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(()=>{const planId=new URLSearchParams(location.search).get('plan')||localStorage.getItem('roya_pending_plan')||'';const plan=plans[planId];if(!plan){document.getElementById('checkout').innerHTML='<div class="loading"><b style="color:#fff">لم يتم تحديد الباقة</b><br><br><button class="back" onclick="location.href=\'./\'">العودة إلى رؤيا</button></div>';return}localStorage.setItem('roya_pending_plan',plan.id);document.getElementById('checkout').innerHTML=`<div class="head"><div class="eyebrow">رؤيا Premium</div><h1>${esc(plan.name_ar)}</h1><div class="meta"><span class="price">${Number(plan.price_sar)} ر.س</span><span>•</span><span>دفع آمن</span></div></div><div class="body"><div class="secure"><b>🔒 دفع مشفّر وآمن</b><br>بيانات البطاقة تُعالج مباشرة عبر ميسر ولا تمر عبر خوادم رؤيا.</div><div class="trust"><div><b>🔐 مشفّر</b>اتصال آمن</div><div><b>💳 ميسر</b>بوابة الدفع</div><div><b>✓ فوري</b>تفعيل Premium</div></div><div class="mysr-form"></div><div class="foot">بالإكمال أنت توافق على تنفيذ عملية الدفع للخطة المحددة عبر ميسر.</div></div>`;const callback=new URL('./',location.href);callback.searchParams.set('payment_return','1');try{Moyasar.init({element:'.mysr-form',amount:Math.round(Number(plan.price_sar)*100),currency:'SAR',description:`اشتراك رؤيا - ${plan.name_ar}`,publishable_api_key:'pk_test_rkBnvVzFvzJiEuZN53iJUuh2Rmg7a7dSdT9Awhkf',callback_url:callback.toString(),language:'ar',methods:['creditcard'],supported_networks:['mada','visa','mastercard'],fixed_width:false,metadata:{plan_id:plan.id},on_completed:p=>{if(p?.id)localStorage.setItem('roya_pending_payment',p.id)},on_failure:e=>console.error(e)});}catch(e){console.error(e);document.getElementById('checkout').innerHTML='<div class="loading">تعذر تشغيل صفحة الدفع. حاول مرة أخرى.</div>'}})();
</script></body></html>
