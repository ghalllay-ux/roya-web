name: Repair Moyasar checkout
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-moyasar.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch index
        shell: bash
        run: |
          git show 95e88c06219a6bf44791a530e24ddc532b64fc48^:index.html > index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""  const {data:cfg,error:cfgError}=await sb.functions.invoke('moyasar-public-config',{body:{}});
  if(cfgError||!cfg?.publishable_key){
    alert('تعذر تحميل إعدادات ميسر التجريبية.');
    console.error(cfgError||cfg);
    return;
  }
"""
          new="""  const cfg={publishable_key:'pk_test_rkBnvVzFvzJiEuZN53iJUuh2Rmg7a7dSdT9Awhkf',mode:'test'};
"""
          if old not in s:
              raise SystemExit('Moyasar config block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Use Moyasar test publishable key in checkout'
          git push