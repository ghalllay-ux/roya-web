name: Upgrade Roya Payment UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-main-payment.yml'
      - 'scripts/payment_ui_v2.py'
      - 'scripts/pricing_offer_v1.py'
      - 'scripts/mobile_app_ui_v1.py'
      - 'scripts/payment_page_v1.py'
      - 'scripts/password_recovery_v1.py'
      - 'payment.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply premium payment window design
        run: python3 scripts/payment_ui_v2.py
      - name: Apply pricing offer presentation
        run: python3 scripts/pricing_offer_v1.py
      - name: Apply premium mobile app experience
        run: python3 scripts/mobile_app_ui_v1.py
      - name: Apply dedicated checkout page route
        run: python3 scripts/payment_page_v1.py
      - name: Add password recovery flow
        run: python3 scripts/password_recovery_v1.py
      - name: Verify payment pricing mobile UI and password recovery
        run: |
          grep -q 'paymentResultCard' index.html
          grep -q 'roya-pricing-offer-70-v1' index.html
          grep -q 'offerBadge70' index.html
          grep -q 'roya-mobile-app-v1' index.html
          grep -q 'royaCheckoutPage' index.html
          grep -q 'leaveCheckoutPage' index.html
          grep -q 'Moyasar.init' index.html
          grep -q 'requestPasswordReset' index.html
          grep -q 'PASSWORD_RECOVERY' index.html
          grep -q 'updateRecoveredPassword' index.html
      - name: Commit upgraded UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add password recovery to Roya login'
          git push
