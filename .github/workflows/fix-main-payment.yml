name: Upgrade Roya Payment UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-main-payment.yml'
      - 'scripts/payment_ui_v2.py'
      - 'scripts/pricing_offer_v1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply premium payment window design
        run: python3 scripts/payment_ui_v2.py
      - name: Apply pricing offer presentation
        run: python3 scripts/pricing_offer_v1.py
      - name: Verify payment and pricing UI
        run: |
          grep -q 'payment-premium-ui-v2' index.html
          grep -q 'paymentHeadRow' index.html
          grep -q 'paymentResultCard' index.html
          grep -q 'roya-pricing-offer-70-v1' index.html
          grep -q 'offerBadge70' index.html
      - name: Commit upgraded payment and pricing UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Upgrade Roya payment windows and pricing offer UI'
          git push
