name: Deploy Roya to Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe logout success UI
        run: |
          python3 scripts/logout_success_ui_v2.py
          grep -q 'roya-logout-toast-v2' index.html
          grep -q 'showLogoutSuccessToast()' index.html
          if grep -q "alert('تم تسجيل الخروج')" index.html; then exit 1; fi
      - name: Apply premium mobile UI v2
        run: |
          python3 scripts/mobile_app_ui_v2.py
          grep -q 'roya-mobile-app-v2' index.html
      - name: Apply native-like mobile UI v3
        run: |
          python3 scripts/mobile_app_ui_v3.py
          grep -q 'roya-mobile-native-v3' index.html
      - name: Apply visual comfort mobile UI v4
        run: |
          python3 scripts/mobile_visual_comfort_v4.py
          grep -q 'roya-mobile-visual-comfort-v4' index.html
      - name: Replace voice browser alert
        run: |
          python3 scripts/mobile_native_notice_v5.py
          grep -q 'roya-mobile-native-notice-v5' index.html
          if grep -q "function voice(){alert(" index.html; then exit 1; fi
      - name: Apply legacy voice layer
        run: |
          python3 scripts/voice_input_v6.py
          grep -q 'roya-voice-input-v6' index.html
      - name: Apply iPhone-safe voice transcription
        run: |
          python3 scripts/voice_input_v7.py
          grep -q 'roya-voice-input-v7' index.html
          grep -q 'MediaRecorder' index.html
          grep -q "transcribe-voice" index.html
      - name: Apply explicit voice controls v8
        run: |
          python3 scripts/voice_input_v8.py
          grep -q 'roya-voice-input-v8' index.html
          grep -q 'بدء التسجيل' index.html
          grep -q 'إيقاف التسجيل' index.html
          grep -q 'startRoyaVoiceRecording' index.html
      - name: Persist patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Add explicit voice start and stop controls v8'
            git push
          fi
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=roya-web --branch=main
