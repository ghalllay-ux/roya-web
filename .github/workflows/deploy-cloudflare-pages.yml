name: Deploy Roya to Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe logout success UI
        run: |
          python3 scripts/logout_success_ui_v2.py
          grep -q 'roya-logout-toast-v2' index.html
          grep -q 'showLogoutSuccessToast()' index.html
          if grep -q "alert('تم تسجيل الخروج')" index.html; then exit 1; fi
      - name: Persist patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Replace native logout alert with in-app toast'
            git push
          fi
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=roya-web --branch=main
