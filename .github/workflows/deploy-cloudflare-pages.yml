name: Deploy Roya to Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore known-good core runtime baseline
        run: |
          git fetch --depth=1 origin a263ad93a6fa213804e9d192730e4c6e2513c51c
          git show a263ad93a6fa213804e9d192730e4c6e2513c51c:index.html > index.html
          grep -q 'function openAuth()' index.html
          grep -q 'const SUPABASE_URL=' index.html
          grep -q 'async function logoutAllDevices()' index.html
      - name: Apply premium logout confirmation UI
        run: |
          python3 scripts/logout_success_ui_v2.py
          grep -q 'roya-logout-confirm-v4' index.html
          grep -q 'requestRoyaLogout()' index.html
          grep -q 'هل تريد تسجيل الخروج؟' index.html
          grep -q 'نعم، تسجيل الخروج' index.html
          grep -q 'لا، البقاء' index.html
      - name: Apply premium mobile UI v2
        run: |
          python3 scripts/mobile_app_ui_v2.py
          grep -q 'roya-mobile-app-v2' index.html
      - name: Apply native-like mobile UI v3
        run: |
          python3 scripts/mobile_app_ui_v3.py
          grep -q 'roya-mobile-native-v3' index.html
      - name: Apply visual comfort mobile UI v4
        run: |
          python3 scripts/mobile_visual_comfort_v4.py
          grep -q 'roya-mobile-visual-comfort-v4' index.html
      - name: Replace voice browser alert
        run: |
          python3 scripts/mobile_native_notice_v5.py
          grep -q 'roya-mobile-native-notice-v5' index.html
      - name: Apply legacy voice layer
        run: python3 scripts/voice_input_v6.py
      - name: Apply iPhone-safe voice transcription
        run: python3 scripts/voice_input_v7.py
      - name: Apply explicit voice controls v8
        run: |
          python3 scripts/voice_input_v8.py
          grep -q 'بدء التسجيل' index.html
          grep -q 'إيقاف التسجيل' index.html
      - name: Apply iPhone upload fix v9
        run: |
          python3 scripts/voice_input_v9.py
          grep -q 'roya-voice-input-v9' index.html
          grep -q "functions/v1/transcribe-voice" index.html
          grep -q 'AUTH_SESSION_MISSING' index.html
      - name: Apply voice diagnostics v10
        run: |
          python3 scripts/voice_diagnostics_v10.py
          grep -q 'roya-voice-diagnostics-v10' index.html
          grep -q 'ROYA_DIAG' index.html
      - name: Apply Safari voice upload v11
        run: |
          python3 scripts/voice_safari_upload_v11.py
          grep -q 'roya-voice-safari-upload-v11' index.html
          grep -q 'SAFARI_FETCH_FAILED' index.html
          if grep -q "'x-roya-diag':diagId" index.html; then exit 1; fi
      - name: Apply Apple Pay checkout base
        run: |
          python3 scripts/payment_page_v1.py
          grep -q "methods:\['creditcard','applepay'\]" index.html
      - name: Apply premium trusted payment UI v2
        run: |
          python3 scripts/payment_ui_v2.py
          grep -q 'roya-payment-ui-v2' index.html
      - name: Build standalone payment page v3
        run: |
          python3 scripts/payment_standalone_v3.py
          test -f payment.html
          grep -q "location.href='payment.html?plan='" index.html
          grep -q "methods:\['creditcard','applepay'\]" payment.html
          grep -q 'دفع آمن عبر ميسر' payment.html
      - name: Fix credit checkout build safety
        run: |
          python3 scripts/credits_checkout_runtime_fix_v2.py
          python3 scripts/credits_handler_boundary_fix_v3.py
      - name: Convert subscriptions to credit packages
        run: |
          python3 scripts/credits_checkout_v1.py
          grep -q 'شحن رصيد التفسيرات' index.html
          grep -q "payment.html?package=" index.html
          grep -q "from('credit_packages')" payment.html
          grep -q "package_id" payment.html
          grep -q 'function openAuth()' index.html
          grep -q 'const SUPABASE_URL=' index.html
          grep -q 'async function logoutAllDevices()' index.html
          grep -q 'requestRoyaLogout()' index.html
          if grep -q '>شهري<' index.html; then exit 1; fi
      - name: Apply premium card fields UI v4
        run: |
          python3 scripts/card_fields_ui_v4.py
          grep -q 'roya-card-fields-premium-v4' payment.html
          grep -q 'بيانات البطاقة' payment.html
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for page in ['index.html','payment.html']:
              text=Path(page).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', text, re.I)
              for i,js in enumerate(scripts,1):
                  out=Path(f'/tmp/{page}.{i}.js')
                  out.write_text(js,encoding='utf-8')
                  print(out)
          PY
          for f in /tmp/index.html.*.js /tmp/payment.html.*.js; do
            [ -f "$f" ] || continue
            node --check "$f"
          done
      - name: Persist patched site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html payment.html
          if ! git diff --cached --quiet; then
            git commit -m 'Deploy logout confirmation and credit checkout'
            git push
          fi
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=roya-web --branch=main
