name: Deploy Werd to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Werd files and JavaScript
        run: |
          test -f werd/index.html
          test -f werd/app.css
          test -f werd/app.js
          test -f werd/notifications.js
          test -f werd/features.js
          test -f werd/audio-engine.js
          test -f werd/reader.js
          test -f werd/listening.js
          test -f werd/prayer.js
          test -f werd/more.js
          test -f werd/search.js
          test -f werd/iman.js
          test -f werd/home.js
          test -f werd/progress.js
          test -f werd/onboarding.js
          test -f werd/profile.js
          test -f werd/mushaf.js
          test -f werd/offline-mushaf.js
          test -f werd/offline-audio.js
          test -f werd/playlist.js
          test -f werd/memorization.js
          test -f werd/memorization-tracker.js
          test -f werd/memorization-test.js
          test -f werd/deep-link.js
          test -f werd/manifest.webmanifest
          test -f werd/service-worker.js
          grep -q "ward_user_state" werd/app.js
          node --check werd/app.js
          node --check werd/notifications.js
          node --check werd/features.js
          node --check werd/audio-engine.js
          node --check werd/reader.js
          node --check werd/listening.js
          node --check werd/prayer.js
          node --check werd/more.js
          node --check werd/search.js
          node --check werd/iman.js
          node --check werd/home.js
          node --check werd/progress.js
          node --check werd/onboarding.js
          node --check werd/profile.js
          node --check werd/mushaf.js
          node --check werd/offline-mushaf.js
          node --check werd/offline-audio.js
          node --check werd/playlist.js
          node --check werd/memorization.js
          node --check werd/memorization-tracker.js
          node --check werd/memorization-test.js
          node --check werd/deep-link.js
          node --check werd/service-worker.js
      - name: Bundle Werd feature layers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('werd/index.html')
          s=p.read_text(encoding='utf-8')
          audio='<script src="./audio-engine.js"></script>'
          reader='<script src="./reader.js"></script>'
          if audio not in s:
              s=s.replace(reader, audio+'\n'+reader)
          for tag in ['<script src="./search.js"></script>','<script src="./iman.js"></script>','<script src="./home.js"></script>','<script src="./progress.js"></script>','<script src="./onboarding.js"></script>','<script src="./profile.js"></script>','<script src="./mushaf.js"></script>','<script src="./offline-mushaf.js"></script>','<script src="./offline-audio.js"></script>','<script src="./playlist.js"></script>','<script src="./memorization.js"></script>','<script src="./memorization-tracker.js"></script>','<script src="./memorization-test.js"></script>','<script src="./deep-link.js"></script>']:
              if tag not in s:
                  s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'audio-engine.js' werd/index.html
          grep -q 'search.js' werd/index.html
          grep -q 'iman.js' werd/index.html
          grep -q 'home.js' werd/index.html
          grep -q 'progress.js' werd/index.html
          grep -q 'onboarding.js' werd/index.html
          grep -q 'profile.js' werd/index.html
          grep -q 'mushaf.js' werd/index.html
          grep -q 'offline-mushaf.js' werd/index.html
          grep -q 'offline-audio.js' werd/index.html
          grep -q 'playlist.js' werd/index.html
          grep -q 'memorization.js' werd/index.html
          grep -q 'memorization-tracker.js' werd/index.html
          grep -q 'memorization-test.js' werd/index.html
          grep -q 'deep-link.js' werd/index.html
      - name: Ensure Cloudflare Pages project exists
        run: npx --yes wrangler@3.90.0 pages project create werd --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Werd
        run: npx --yes wrangler@3.90.0 pages deploy ./werd --project-name=werd --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
