name: Diagnose Roya JavaScript

on:
  push:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for page in ['index.html','payment.html']:
              if not Path(page).exists():
                  continue
              text=Path(page).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', text, re.I)
              print(page, 'inline scripts:', len(scripts))
              for i,js in enumerate(scripts,1):
                  out=Path(f'/tmp/{page}.{i}.js')
                  out.write_text(js,encoding='utf-8')
                  print(out)
          PY
          for f in /tmp/index.html.*.js /tmp/payment.html.*.js; do
            [ -f "$f" ] || continue
            echo "Checking $f"
            node --check "$f"
          done
