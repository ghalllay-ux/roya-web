name: Build Roya V13

on:
  push:
    branches: [main]
    paths:
      - '.build/**'
      - '.github/workflows/build-roya-v13.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild index.html
        run: |
          cat .build/part1.txt .build/part2.txt .build/part3.txt .build/part4.txt .build/part5.txt > /tmp/roya.b64
          base64 -d /tmp/roya.b64 > /tmp/roya.html.gz
          gzip -dc /tmp/roya.html.gz > index.html
          test -s index.html
          grep -q '<title>رؤيا | تفسير الأحلام الذكي</title>' index.html
      - name: Commit generated site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Publish Roya V13 Moyasar test payment'
            git push
          fi
